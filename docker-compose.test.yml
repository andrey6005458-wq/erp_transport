# docker-compose.test.yml
#
# Тестовый Postgres — отдельный контейнер, порт 5433, свой volume.
# Не пересекается с dev-контейнером из docker-compose.yml (порт 5432).
#
# Переменные берутся из .env.test (не из .env).
#
# Запуск:        docker compose -f docker-compose.test.yml --env-file .env.test up -d
# Стоп:          docker compose -f docker-compose.test.yml --env-file .env.test down
# Полный сброс:  docker compose -f docker-compose.test.yml --env-file .env.test down -v
# Проверка:      docker compose -f docker-compose.test.yml --env-file .env.test ps

services:
  db_test:
    image: postgres:16
    container_name: erp_transport_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_test:
